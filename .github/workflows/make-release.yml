name: Make release

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to build
        required: true
        type: string
      override_version:
        description: Optional tag and release version override
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean
      publish:
        description: Create the tag and GitHub release
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      configured_version: ${{ steps.prepare.outputs.configured_version }}
      effective_version: ${{ steps.prepare.outputs.effective_version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Validate release parameters
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          OVERRIDE_VERSION: ${{ inputs.override_version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ ! "$PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid project name: $PROJECT" >&2
            exit 1
          fi
          if [[ ! -f "$PROJECT/build.sh" ]]; then
            echo "Project does not exist or has no build script: $PROJECT" >&2
            exit 1
          fi

          mapfile -t version_lines < <(sed -n 's/^VERSION=//p' "$PROJECT/build.sh")
          if (( ${#version_lines[@]} != 1 )); then
            echo "Expected exactly one VERSION assignment in $PROJECT/build.sh" >&2
            exit 1
          fi

          configured_version=${version_lines[0]}
          if [[ "$configured_version" == \"*\" && "$configured_version" == *\" ]]; then
            configured_version=${configured_version:1:-1}
          elif [[ "$configured_version" == \'*\' && "$configured_version" == *\' ]]; then
            configured_version=${configured_version:1:-1}
          fi
          if [[ -z "$configured_version" || "$configured_version" =~ [[:space:]] ]]; then
            echo "Invalid configured version: $configured_version" >&2
            exit 1
          fi

          effective_version=${OVERRIDE_VERSION:-$configured_version}
          if [[ ! "$effective_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Invalid release version: $effective_version" >&2
            exit 1
          fi
          tag="$PROJECT-$effective_version"
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          if [[ "$PUBLISH" == true ]]; then
            existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
            if [[ -n "$existing_tag" ]]; then
              echo "Tag already exists: $tag" >&2
              exit 1
            fi
          fi

          artifact_name="release-$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "artifact_name=$artifact_name"
            echo "configured_version=$configured_version"
            echo "effective_version=$effective_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT"
          echo "Configured build version: $configured_version"
          echo "Release version: $effective_version"
          echo "Release tag: $tag"
          echo "Publish: $PUBLISH"

      - name: Build and test
        env:
          PROJECT: ${{ inputs.project }}
        run: ./"$PROJECT"/build.sh

      - name: Verify build artifacts
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          CONFIGURED_VERSION: ${{ steps.prepare.outputs.configured_version }}
        run: |
          set -euo pipefail
          for architecture in x86_64 aarch64; do
            artifact="releases/$PROJECT-$CONFIGURED_VERSION-linux-$architecture.tar.gz"
            if [[ ! -s "$artifact" ]]; then
              echo "Missing or empty build artifact: $artifact" >&2
              exit 1
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: releases/${{ inputs.project }}-${{ steps.prepare.outputs.configured_version }}-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: releases

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          CONFIGURED_VERSION: ${{ needs.build.outputs.configured_version }}
          EFFECTIVE_VERSION: ${{ needs.build.outputs.effective_version }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          existing_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          artifacts=(releases/"$PROJECT-$CONFIGURED_VERSION"-linux-*.tar.gz)
          if (( ${#artifacts[@]} != 2 )); then
            echo "Expected two release artifacts, found ${#artifacts[@]}" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            if [[ ! -s "$artifact" ]]; then
              echo "Missing or empty release artifact: $artifact" >&2
              exit 1
            fi
          done

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"

          release_args=(
            "$TAG"
            "${artifacts[@]}"
            --verify-tag
            --latest=false
            --title "$TAG"
            --notes "Static $PROJECT $CONFIGURED_VERSION builds from $GITHUB_SHA. Release label: $EFFECTIVE_VERSION."
          )
          if [[ "$PRERELEASE" == true ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
